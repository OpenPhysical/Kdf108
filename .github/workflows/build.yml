name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '23 8 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # Gate: Fast. LongRunning is excluded because the pinned CAVP corpus executes
      # 16,000 SP 800-108 and 161,436 SP 800-56A vectors per framework;
      # the separate positive-selection gates below are mandatory.
      - name: Fast tests
        run: dotnet test --no-build --configuration Release --filter "TestCategory!=LongRunning&TestCategory!=LegacyDiagnostic"
      - run: dotnet pack src/Kdf108/Kdf108.csproj --no-build --configuration Release --output artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/*.*nupkg

  cavp-sp800-108:
    name: CAVP SP 800-108 (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net9.0, net10.0]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # Gate: CAVP-SP800-108. Positive selection proves all pinned published
      # answers execute; merely parsing the files cannot establish conformance.
      - name: Execute required CAVP vectors
        run: >-
          dotnet test tests/Kdf108.Test/Kdf108.Test.csproj
          --no-build --configuration Release
          --framework ${{ matrix.framework }}
          --filter "TestCategory=CAVP-SP800-108"
          --logger "trx;LogFileName=cavp-${{ matrix.framework }}.trx"
          --results-directory artifacts/test-results/${{ matrix.framework }}
      - name: Verify corpus and execution evidence
        shell: pwsh
        run: >-
          ./tests/verify-conformance-results.ps1
          -ResultsDirectory artifacts/test-results/${{ matrix.framework }}
          -GateName CAVP-SP800-108

  cavp-sp800-56a:
    name: ${{ matrix.gate }} (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net9.0, net10.0]
        gate:
          - CAVP-SP800-56A-ECC-ZZ
          - CAVP-SP800-56A-ECC-KDF
          - CAVP-SP800-56A-ECC-KC
          - CAVP-SP800-56A-FFC-ZZ
          - CAVP-SP800-56A-FFC-KDF
          - CAVP-SP800-56A-FFC-KC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # Six exact, disjoint shards make missing or overlapping corpus execution visible.
      - name: Execute required CAVP shard
        run: >-
          dotnet test tests/Kdf108.Test/Kdf108.Test.csproj
          --no-build --configuration Release
          --framework ${{ matrix.framework }}
          --filter "TestCategory=${{ matrix.gate }}"
          --logger "trx;LogFileName=${{ matrix.gate }}-${{ matrix.framework }}.trx"
          --results-directory artifacts/test-results/${{ matrix.gate }}/${{ matrix.framework }}
      - name: Verify execution evidence
        shell: pwsh
        run: >-
          ./tests/verify-conformance-results.ps1
          -ResultsDirectory artifacts/test-results/${{ matrix.gate }}/${{ matrix.framework }}
          -GateName ${{ matrix.gate }}
