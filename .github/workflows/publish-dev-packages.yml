name: Publish immutable DEV package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kdf108-dev-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'OpenPhysical/Kdf108' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      MSBUILDDISABLENODEREUSE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_COMMIT: ${{ github.sha }}
      PACKAGE_VERSION: '3.0.1-dev.20261116.2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Verify the exact source and receipt checks
        run: |
          python scripts/assert-package-source.py --source-commit "$SOURCE_COMMIT"
          python scripts/test-nuget-publication-receipt.py
      - name: Restore, build and test locked dependencies
        run: |
          dotnet restore Kdf108.sln --locked-mode --configfile scripts/nuget-public-restore.config
          dotnet build Kdf108.sln -c Release --no-restore --disable-build-servers -m:1 -p:UseSharedCompilation=false
          dotnet test Kdf108.sln -c Release --no-build --no-restore --disable-build-servers -m:1 --logger trx --results-directory artifacts/test-results
      - name: Pack the tested source and record exact archive bytes
        run: |
          python scripts/assert-package-source.py --source-commit "$SOURCE_COMMIT"
          python scripts/pack-publisher-projects.py --source-commit "$SOURCE_COMMIT" --package-version "$PACKAGE_VERSION" --output artifacts/packages
          python scripts/write-nuget-publication-manifest.py --repository Kdf108 --source-commit "$SOURCE_COMMIT" --package-version "$PACKAGE_VERSION" --packages artifacts/packages --output artifacts/package-manifest.json
      - name: Require private ownership and an unused package version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          python scripts/verify-nuget-publication-receipt.py --manifest artifacts/package-manifest.json --preflight
          python scripts/check-nuget-versions-absent.py --manifest artifacts/package-manifest.json
      - name: Retain the source-bound archive before publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kdf108-dev-${{ github.sha }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/package-manifest.json
            artifacts/test-results/*.trx
          if-no-files-found: error
          retention-days: 90
      - name: Publish the immutable DEV package
        env:
          NuGetPackageSourceCredentials_openphysical: Username=${{ github.actor }};Password=${{ github.token }}
        run: dotnet nuget push "artifacts/packages/Kdf108.$PACKAGE_VERSION.nupkg" --source openphysical --configfile scripts/nuget-publish.config --no-symbols
      - name: Verify private linkage and exact fresh NuGet restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: >-
          python scripts/verify-nuget-publication-receipt.py
          --manifest artifacts/package-manifest.json
          --workspace "$RUNNER_TEMP/kdf108-receipt"
          --receipt "$RUNNER_TEMP/publication-receipt.json"
      - name: Retain the publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kdf108-dev-receipt-${{ github.sha }}
          path: "${{ runner.temp }}/publication-receipt.json"
          if-no-files-found: error
          retention-days: 90
