name: Conformance

# Reusable: build.yml runs it on every change and publish.yml runs it before releasing.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  fast:
    name: Fast lane (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          dotnet-version: 9.0.x
      - run: dotnet build --configuration Release
      # tests/fast.runsettings is the default: everything except the CAVP gates.
      - run: dotnet test --no-build --configuration Release

  build:
    name: Build gate binaries (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        framework: [net9.0, net10.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          dotnet-version: 9.0.x
      - run: dotnet build tests/Kdf108.Test --configuration Release --framework ${{ matrix.framework }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gate-binaries-${{ matrix.framework }}
          path: tests/Kdf108.Test/bin/Release/${{ matrix.framework }}
          retention-days: 1

  cavp:
    name: ${{ matrix.lane }} (${{ matrix.framework }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net9.0, net10.0]
        lane: [primitives-and-kdf, ecc-key-confirmation, ffc-key-confirmation]
        include:
          - lane: primitives-and-kdf
            gates: CAVP-SP800-108 CAVP-SP800-56A-ECC-ZZ CAVP-SP800-56A-ECC-KDF CAVP-SP800-56A-FFC-ZZ CAVP-SP800-56A-FFC-KDF
          - lane: ecc-key-confirmation
            gates: CAVP-SP800-56A-ECC-KC
          - lane: ffc-key-confirmation
            gates: CAVP-SP800-56A-FFC-KC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          dotnet-version: 9.0.x
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: gate-binaries-${{ matrix.framework }}
          path: tests/Kdf108.Test/bin/Release/${{ matrix.framework }}
      # Each gate runs and is verified on its own, so its evidence cannot mix with another's.
      - name: Execute and verify gates
        shell: pwsh
        run: |
          foreach ($gate in '${{ matrix.gates }}'.Split(' ')) {
            $results = "artifacts/test-results/$gate"
            dotnet test tests/Kdf108.Test/bin/Release/${{ matrix.framework }}/Kdf108.Test.dll `
              --settings tests/cavp.runsettings --filter "TestCategory=$gate" `
              --logger "trx;LogFileName=$gate.trx" --results-directory $results
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ./tests/verify-conformance-results.ps1 -ResultsDirectory $results -GateName $gate
          }

  pack:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          dotnet-version: 9.0.x
      - run: dotnet pack src/Kdf108/Kdf108.csproj --configuration Release --output artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages
          path: artifacts/*.*nupkg
