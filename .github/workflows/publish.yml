name: Publish NuGet

on:
  push:
    tags:
      - 'v*.*.*'  # e.g., v1.0.0

permissions:
  contents: read

jobs:
  # The release runs the same fast lane and all seven verified CAVP gates as CI.
  conformance:
    uses: ./.github/workflows/conformance.yml

  build-and-publish:
    needs: conformance
    runs-on: ubuntu-latest
    environment: nuget-production

    permissions:
      contents: read
      id-token: write  # NuGet trusted publishing exchanges this job's OIDC token for a short-lived API key

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify annotated signed release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          GATE_REASON: A release tag authorizes publication of a cryptographic package and must be an annotated signature verified by GitHub.
        run: |
          set -euo pipefail
          ref_json="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          tag_sha="$(jq -r '.object.sha' <<<"${ref_json}")"
          tag_type="$(jq -r '.object.type' <<<"${ref_json}")"
          if [[ "${tag_type}" != "tag" ]]; then
            echo "::error::Release gate failed: ${GATE_REASON} Lightweight tags are not accepted."
            exit 1
          fi
          tag_json="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/git/tags/${tag_sha}")"
          if [[ "$(jq -r '.verification.verified' <<<"${tag_json}")" != "true" ]]; then
            reason="$(jq -r '.verification.reason // "unknown"' <<<"${tag_json}")"
            echo "::error::Release gate failed: ${GATE_REASON} Verification reason: ${reason}."
            exit 1
          fi

      - name: Verify the tag is on master
        env:
          GATE_REASON: Only reviewed commits on master may be released.
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "::error::Release gate failed: ${GATE_REASON}"
            exit 1
          fi

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify tag and package versions match
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GATE_REASON: The immutable package version must identify the exact signed source tag that authorized publication.
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          project_version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props)"
          if [[ -z "${project_version}" || "${tag_version}" != "${project_version}" ]]; then
            echo "::error::Release gate failed: ${GATE_REASON} Tag=${tag_version}, project=${project_version:-missing}."
            exit 1
          fi

      - name: Pack NuGet package
        run: dotnet pack src/Kdf108/Kdf108.csproj -c Release -o ./nupkg

      - name: Log in to NuGet.org (trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: mistial-dev

      - name: Push tested package to NuGet.org
        env:
          GATE_REASON: A version collision indicates an unexpected release-state mismatch and must fail visibly.
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      # Earlier versions stay restorable by exact version; unlisting only hides them from search
      # and "latest". Only versions lower than this release are unlisted, so a patch to an older
      # major never hides a newer one.
      - name: Unlist earlier versions
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $released = [System.Management.Automation.SemanticVersion]::Parse($env:RELEASE_TAG.TrimStart('v'))
          $index = Invoke-RestMethod 'https://api.nuget.org/v3/registration5-gz-semver2/kdf108/index.json'
          foreach ($page in $index.items) {
            $items = if ($page.items) { $page.items } else { (Invoke-RestMethod $page.'@id').items }
            foreach ($entry in $items.catalogEntry) {
              $version = [System.Management.Automation.SemanticVersion]::Parse(($entry.version -split '\+')[0])
              $listed = $null -eq $entry.listed -or $entry.listed
              if ($listed -and $version -lt $released) {
                Write-Host "Unlisting Kdf108 $($entry.version)"
                dotnet nuget delete Kdf108 $entry.version --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --non-interactive
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
            }
          }
